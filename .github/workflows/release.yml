name: Build and Release PMS_Weekly_Report EXE

on:
  push:
    branches:
      - main
      - master
    paths:
      - "CHANGELOG.md"
      - "**/*.py"
      - "version_info.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller playwright

      - name: Extract Version Tag and Release Notes from CHANGELOG.md
        id: vars
        shell: pwsh
        run: |
          $tag = $null
          $notesLines = New-Object System.Collections.Generic.List[string]

          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md" -Encoding UTF8
            $inLatestSection = $false
            foreach ($line in $lines) {
              if ($line -match '^##\s+\[(v[^\]]+)\]') {
                if (-not $inLatestSection) {
                  $tag = $Matches[1].Trim()
                  $inLatestSection = $true
                  continue
                } else {
                  break
                }
              }
              if ($inLatestSection) {
                $notesLines.Add($line)
              }
            }
          }

          if (-not $tag) {
            $pyContent = Get-Content "run_pms_sync.py" -Raw -Encoding UTF8
            if ($pyContent -match 'CURRENT_VERSION\s*=\s*"([^"]+)"') {
              $tag = $Matches[1]
            } else {
              $tag = "v1.0.2"
            }
          }

          $notesText = ($notesLines -join "`n").Trim()
          $notesText = ($notesText -replace '(?m)\s*---\s*\z', '').Trim()
          if (-not $notesText) {
            $notesText = "Automated Windows EXE build for $tag"
          }

          Set-Content -Path "release_notes.md" -Value $notesText -Encoding UTF8
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build PMS_Weekly_Report.exe
        run: |
          python -m PyInstaller --onefile --noconfirm --clean `
            --name "PMS_Weekly_Report" `
            --version-file "version_info.txt" `
            --collect-all playwright `
            run_pms_sync.py

      - name: Upload Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: PMS_Weekly_Report-${{ steps.vars.outputs.tag }}
          path: dist/PMS_Weekly_Report.exe

      - name: Sync Git Tag to Current Commit
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag ${{ github.sha }}
          git push origin "refs/tags/$tag" --force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          body_path: release_notes.md
          overwrite_files: true
          files: dist/PMS_Weekly_Report.exe
